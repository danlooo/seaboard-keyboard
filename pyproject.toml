[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seaboard-keyboard"
version = "0.1.0"
description = "Use a ROLI Seaboard as a computer keyboard"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
seaboard-keyboard = "seaboard_keyboard.daemon:main"
seaboard-probe = "seaboard_keyboard.probe:main"

[tool.setuptools.packages.find]
where = ["src"]
